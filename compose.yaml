services:
  gateway:
    build: .
    restart: unless-stopped
    environment:
      GATEWAY_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      DATABASE_URL: sqlite:///data/gateway.db?mode=rwc
    volumes:
      - gateway-data:/data
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:3000/health/live"]
      interval: 15s
      timeout: 3s
      retries: 5
volumes:
  gateway-data:
